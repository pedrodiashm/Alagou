# ============================================================
# TEMPLATE HTTPS — NÃO ATIVO POR PADRÃO
# Use quando tiver um DOMÍNIO (Let's Encrypt não emite p/ IP puro).
# Passo a passo: GUIA_DEPLOY_AWS.md → seção "Quando tiver um domínio (HTTPS real)"
#
# Como ativar:
#   1. Emitir o certificado com certbot (webroot via nginx na porta 80)
#   2. Copiar este arquivo para nginx.conf (ou incluir no Dockerfile.web)
#   3. Mountar /etc/letsencrypt como volume no container web_gateway
#   4. Expor a porta 443 no docker-compose.prod.yml e no Security Group
# ============================================================

server {
    listen 80;
    server_name alagou.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name alagou.example.com;

    ssl_certificate     /etc/letsencrypt/live/alagou.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alagou.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|otf|webp|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    location /ws {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}